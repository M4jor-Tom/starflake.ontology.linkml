    name: core
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/Core
    description: Building blocks shared by content and state.
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
  content:
    name: content
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/Content
    description: Static, designer-authored definitions bundled in a ContentPack.
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
  state:
    name: state
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/State
    description: Persisted and replicated session state, rooted at GameSession.
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
