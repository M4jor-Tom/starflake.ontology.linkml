classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/NamedThing
    description: Anything identifiable and named, whether content or state.
    in_subset:
    - core
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    exact_mappings:
    - schema:Thing
    abstract: true
    slots:
    - id
    - name
    - description
    class_uri: schema:Thing
  Vector3D:
    name: Vector3D
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/Vector3D
    description: A 3D vector in metres (position) or metres per second (velocity).
      Named Vector3D so it does not shadow the engine's own Vector3.
    in_subset:
    - core
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    slots:
    - x
    - y
    - z
    class_uri: starflake:Vector3D
  Attitude:
    name: Attitude
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/Attitude
    description: The rotation of a body in 3D space, stored as a unit quaternion.
      Named Attitude (the aerospace term) so it does not clash with the engine's Quaternion
      type or Godot's Orientation enum.
    in_subset:
    - core
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    slots:
    - x
    - y
    - z
    - w
    class_uri: starflake:Attitude
  ContentPack:
    name: ContentPack
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/ContentPack
    description: A versioned bundle of designer-authored content. Everything a session
      references by identifier is defined here.
    in_subset:
    - content
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: NamedThing
    slots:
    - id
    - name
    - description
    - contentPack__weapon_types
    - contentPack__ship_classes
    - contentPack__enemy_types
    - contentPack__asteroid_types
    - contentPack__starting_ship_class
    - contentPack__galaxy
    attributes:
      weapon_types:
        name: weapon_types
        description: Weapons available to ship classes.
        range: WeaponType
        multivalued: true
        inlined_as_list: true
      ship_classes:
        name: ship_classes
        description: Hull designs available to player and enemy ships.
        range: ShipClass
        multivalued: true
        inlined_as_list: true
      enemy_types:
        name: enemy_types
        description: Hostile archetypes that can spawn in star systems.
        range: EnemyType
        multivalued: true
        inlined_as_list: true
      asteroid_types:
        name: asteroid_types
        description: Asteroid kinds that can spawn in star systems.
        range: AsteroidType
        multivalued: true
        inlined_as_list: true
      starting_ship_class:
        name: starting_ship_class
        description: The hull every new player ship is built from.
        range: ShipClass
        required: true
        inlined: false
      galaxy:
        name: galaxy
        description: The map played with this content.
        range: Galaxy
        required: true
        inlined: true
    class_uri: starflake:ContentPack
    tree_root: true
  WeaponType:
    name: WeaponType
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/WeaponType
    description: A ship-mounted weapon that fires projectiles.
    in_subset:
    - content
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: NamedThing
    slots:
    - id
    - name
    - description
    - weaponType__damage
    - weaponType__fire_rate
    - weaponType__projectile_speed
    - weaponType__max_range
