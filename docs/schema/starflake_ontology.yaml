        required: true
        minimum_value: 1
    class_uri: starflake:SpawnRegion
  AsteroidField:
    name: AsteroidField
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/AsteroidField
    description: A region filled with asteroids of one type.
    in_subset:
    - content
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: SpawnRegion
    slots:
    - SpawnRegion_radius
    - spawnRegion__center
    - spawnRegion__spawn_count
    - asteroid_type
    class_uri: starflake:AsteroidField
  EnemyGroup:
    name: EnemyGroup
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/EnemyGroup
    description: A region where enemies of one type spawn.
    in_subset:
    - content
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: SpawnRegion
    slots:
    - SpawnRegion_radius
    - spawnRegion__center
    - spawnRegion__spawn_count
    - enemy_type
    class_uri: starflake:EnemyGroup
  GameSession:
    name: GameSession
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/GameSession
    description: 'The persisted state of one play session: a save file in solo, the
      authoritative world on a host or dedicated server in multiplayer.'
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    slots:
    - id
    - gameSession__content_pack
    - gameSession__hosting_mode
    - gameSession__host
    - gameSession__max_players
    - gameSession__players
    - gameSession__player_ships
    - gameSession__system_states
    attributes:
      content_pack:
        name: content_pack
        description: The content this session was created with.
        range: ContentPack
        required: true
        inlined: false
      hosting_mode:
        name: hosting_mode
        description: Who runs the authoritative simulation.
        range: HostingMode
        required: true
      host:
        name: host
        description: The player hosting the session. Absent on a dedicated server.
        range: Player
        inlined: false
      max_players:
        name: max_players
        description: Maximum number of players allowed at once.
        range: integer
        required: true
        minimum_value: 1
      players:
        name: players
        description: Everyone who has joined the session.
        range: Player
        required: true
        multivalued: true
        inlined_as_list: true
      player_ships:
        name: player_ships
        description: The ship of each player.
        range: PlayerShip
        multivalued: true
        inlined_as_list: true
      system_states:
        name: system_states
        description: State of the systems visited so far. A system without state has
          not been generated yet.
        range: StarSystemState
        multivalued: true
        inlined_as_list: true
    class_uri: starflake:GameSession
    rules:
    - preconditions:
        slot_conditions:
          hosting_mode:
            name: hosting_mode
            equals_string: solo
      postconditions:
        slot_conditions:
          max_players:
            name: max_players
            equals_number: 1
      description: Solo sessions hold exactly one player.
    - preconditions:
        slot_conditions:
          hosting_mode:
            name: hosting_mode
            equals_string: dedicated_server
      postconditions:
        slot_conditions:
          host:
            name: host
            value_presence: ABSENT
      description: No player hosts a session that runs on a dedicated server.
  Player:
    name: Player
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/Player
    description: A person taking part in a session. Its name is shown to other players.
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: NamedThing
    slots:
    - id
    - name
    - description
    class_uri: starflake:Player
  StarSystemState:
    name: StarSystemState
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/StarSystemState
    description: 'The world state of one star system within a session: what remains
      of its asteroids and enemies, and the loot floating there.'
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    slots:
    - starSystemState__star_system
    - starSystemState__asteroids
    - starSystemState__enemy_ships
    - starSystemState__loot_drops
    attributes:
      star_system:
        name: star_system
        description: The star system this state belongs to.
        range: StarSystem
        required: true
        inlined: false
      asteroids:
        name: asteroids
        description: Asteroids not broken yet.
        range: Asteroid
        multivalued: true
        inlined_as_list: true
      enemy_ships:
        name: enemy_ships
        description: Enemy ships not destroyed yet.
        range: EnemyShip
        multivalued: true
        inlined_as_list: true
      loot_drops:
        name: loot_drops
        description: Fuel not collected yet.
        range: LootDrop
        multivalued: true
        inlined_as_list: true
    class_uri: starflake:StarSystemState
  SpaceEntity:
    name: SpaceEntity
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/SpaceEntity
    description: Anything with a physical presence in a star system. The identifier
      doubles as the network id in multiplayer.
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    abstract: true
    slots:
    - id
    - spaceEntity__position
    - spaceEntity__velocity
    - spaceEntity__orientation
    attributes:
      position:
        name: position
        description: Position relative to the star of the current system.
        range: Vector3D
        required: true
        inlined: true
      velocity:
        name: velocity
        description: Linear velocity.
        range: Vector3D
        inlined: true
      orientation:
        name: orientation
        description: Facing of the entity.
        range: Attitude
        inlined: true
    class_uri: starflake:SpaceEntity
  Ship:
    name: Ship
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/Ship
    description: A flying, armed entity that can be destroyed.
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: SpaceEntity
    abstract: true
    slots:
    - id
    - spaceEntity__position
    - spaceEntity__velocity
    - spaceEntity__orientation
    - ship__hull
    attributes:
      hull:
        name: hull
        description: Remaining hull points. The ship is destroyed at zero.
        range: Amount
        required: true
    class_uri: starflake:Ship
  PlayerShip:
    name: PlayerShip
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/PlayerShip
    description: A ship flown by a player.
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: Ship
    slots:
    - id
    - spaceEntity__position
    - spaceEntity__velocity
    - spaceEntity__orientation
    - ship__hull
    - ship_class
    - playerShip__pilot
    - playerShip__current_system
    - playerShip__fuel
    attributes:
      pilot:
        name: pilot
        description: The player flying the ship.
        range: Player
        required: true
        inlined: false
      current_system:
        name: current_system
        description: The star system the ship is in.
        range: StarSystem
        required: true
        inlined: false
      fuel:
        name: fuel
        description: Fuel in the tank, at most the ship class fuel_capacity.
        range: Amount
        required: true
    class_uri: starflake:PlayerShip
  EnemyShip:
    name: EnemyShip
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/EnemyShip
    description: A hostile AI ship. Its hull design comes from its enemy type.
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: Ship
    slots:
    - id
    - spaceEntity__position
    - spaceEntity__velocity
    - spaceEntity__orientation
    - ship__hull
    - enemy_type
    class_uri: starflake:EnemyShip
  Asteroid:
    name: Asteroid
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/Asteroid
    description: An asteroid that breaks into a fuel loot drop when shot enough.
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: SpaceEntity
    slots:
    - id
    - spaceEntity__position
    - spaceEntity__velocity
    - spaceEntity__orientation
    - asteroid_type
    - asteroid__integrity
    attributes:
      integrity:
        name: integrity
        description: Remaining integrity. The asteroid breaks at zero.
        range: Amount
        required: true
    class_uri: starflake:Asteroid
  LootDrop:
    name: LootDrop
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/LootDrop
    description: Fuel floating in space, collected by flying a player ship into it.
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    is_a: SpaceEntity
    slots:
    - id
    - spaceEntity__position
    - spaceEntity__velocity
    - spaceEntity__orientation
    - lootDrop__fuel_amount
    attributes:
      fuel_amount:
        name: fuel_amount
        description: Fuel collected by picking up this drop.
        range: Amount
        required: true
    class_uri: starflake:LootDrop
