    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  SpectralClass:
    name: SpectralClass
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/SpectralClass
    description: Morgan-Keenan spectral class of a star, hottest to coolest.
    in_subset:
    - content
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    permissible_values:
      o:
        text: o
        description: Blue, above 30,000 K.
        title: O
      b:
        text: b
        description: Blue-white, 10,000 to 30,000 K.
        title: B
      a:
        text: a
        description: White, 7,500 to 10,000 K.
        title: A
      f:
        text: f
        description: Yellow-white, 6,000 to 7,500 K.
        title: F
      g:
        text: g
        description: Yellow, 5,200 to 6,000 K, like the Sun.
        title: G
      k:
        text: k
        description: Orange, 3,700 to 5,200 K.
        title: K
      m:
        text: m
        description: Red, below 3,700 K.
        title: M
  HostingMode:
    name: HostingMode
    definition_uri: https://w3id.org/M4jor-Tom/starflake-ontology/HostingMode
    description: Who runs the authoritative simulation of a session.
    in_subset:
    - state
    from_schema: https://w3id.org/M4jor-Tom/starflake-ontology
    permissible_values:
      solo:
        text: solo
        description: Single player, simulated locally, no network.
      player_hosted:
        text: player_hosted
        description: A player's game acts as server for the players they invite.
      dedicated_server:
        text: dedicated_server
        description: A server not run by any player hosts the session.
