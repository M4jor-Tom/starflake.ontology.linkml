# Starter content: two systems in a line, one weapon, two hulls.
id: core
name: Starflake core content
weapon_types:
  - id: pulse_laser
    name: Pulse laser
    damage: 10
    fire_rate: 4
    projectile_speed: 600
    max_range: 1200
ship_classes:
  - id: scout
    name: Scout
    max_hull: 100
    max_speed: 250
    acceleration: 80
    turn_rate: 2.5
    fuel_capacity: 100
    weapons: [pulse_laser]
  - id: raider
    name: Raider
    max_hull: 40
    max_speed: 200
    acceleration: 60
    turn_rate: 2.0
    fuel_capacity: 0
    weapons: [pulse_laser]
enemy_types:
  - id: pirate
    name: Pirate
    ship_class: raider
    detection_range: 800
    fuel_drop: 15
asteroid_types:
  - id: ice_rock
    name: Ice rock
    radius: 20
    max_integrity: 50
    fuel_drop: 10
galaxy:
  id: milky_way
  name: Milky Way
  starting_system: sol
  star_systems:
    - id: sol
      name: Sol
      star_class: g
      bounds_radius: 10000
      jump_fuel_cost: 60
      jump_targets: [alpha_centauri]
      asteroid_fields:
        - asteroid_type: ice_rock
          center: {x: 2000, y: 0, z: 500}
          radius: 800
          spawn_count: 12
      enemy_groups:
        - enemy_type: pirate
          center: {x: -3000, y: 200, z: 0}
          radius: 500
          spawn_count: 3
    - id: alpha_centauri
      name: Alpha Centauri
      star_class: g
      bounds_radius: 12000
      jump_fuel_cost: 80
      jump_targets: [sol]
