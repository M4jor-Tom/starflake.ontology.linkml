name: starflake-ontology
description: "Domain ontology for Starflake, an open-world 3D space explorer.\n\n\
  The pilot flies a ship through a galaxy of star systems, shoots enemies and\nasteroids,\
  \ loots the fuel they drop, and jumps to a neighbouring system once\nthe tank holds\
  \ enough fuel.\n\nThe schema has two layers:\n\n* **Content** (`ContentPack`): static,\
  \ designer-authored definitions such as\n  ship classes, weapons, enemy and asteroid\
  \ types, and the galaxy map.\n* **State** (`GameSession`): the persisted, replicable\
  \ state of one play\n  session, which references content by identifier.\n\nUnits:\
  \ distances in metres, time in seconds, angles in radians."
title: Starflake ontology
see_also:
- https://M4jor-Tom.github.io/starflake-ontology
id: https://w3id.org/M4jor-Tom/starflake-ontology
imports:
- linkml:types
license: Apache-2.0
prefixes:
  starflake:
    prefix_prefix: starflake
    prefix_reference: https://w3id.org/M4jor-Tom/starflake-ontology/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
default_prefix: starflake
default_range: string
subsets:
