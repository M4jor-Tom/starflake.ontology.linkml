---
id: https://w3id.org/M4jor-Tom/starflake-ontology
name: starflake-ontology
title: Starflake ontology
description: |-
  Domain ontology for Starflake, an open-world 3D space explorer.

  A pilot flies a ship through a galaxy of star systems, shoots raiders and
  asteroids, scoops up the fuel they leave, and jumps to a neighbouring system
  once the tank holds enough fuel.

  The ontology describes the universe only, in words one of its inhabitants
  would use. How the game is played, hosted and tuned is specified in the
  design repository.

  The schema has two layers:

  * **Content** (`Galaxy`): what exists, such as ship classes, weapons,
    raider and asteroid types, and the star systems.
  * **State** (`GalaxyState`): what is where at one moment, which references
    content by identifier.

  Units: distances in metres, time in seconds, angles in radians.
license: Apache-2.0
see_also:
  - https://M4jor-Tom.github.io/starflake-ontology

prefixes:
  starflake: https://w3id.org/M4jor-Tom/starflake-ontology/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: starflake
default_range: string

imports:
  - linkml:types

subsets:
  core:
    description: Building blocks shared by content and state.
  content:
    description: What exists in a galaxy, rooted at Galaxy.
  state:
    description: What is where at one moment, rooted at GalaxyState.

types:
  Amount:
    typeof: float
    uri: xsd:float
    base: float
    minimum_value: 0
    description: A non-negative quantity such as hull points, damage or fuel.
  Distance:
    typeof: float
    uri: xsd:float
    base: float
    minimum_value: 0
    unit:
      ucum_code: m
    description: A non-negative length in metres.
  Speed:
    typeof: float
    uri: xsd:float
    base: float
    minimum_value: 0
    unit:
      ucum_code: m/s
    description: A non-negative speed in metres per second.

classes:

  # ------------------------------------------------------------ core

  NamedThing:
    in_subset: [core]
    abstract: true
    description: Anything identifiable and named, whether content or state.
    slots:
      - id
      - name
      - description
    class_uri: schema:Thing

  Vector3D:
    in_subset: [core]
    description: >-
      A 3D vector in metres (position) or metres per second (velocity).
      Named Vector3D so it does not shadow the engine's own Vector3.
    slots: [x, y, z]

  Attitude:
    in_subset: [core]
    description: >-
      The rotation of a body in 3D space, stored as a unit quaternion.
      Named Attitude (the aerospace term) so it does not clash with the
      engine's Quaternion type or Godot's Orientation enum.
    slots: [x, y, z, w]

  # ------------------------------------------------------------ content

  WeaponType:
    in_subset: [content]
    is_a: NamedThing
    description: A ship-mounted weapon that fires projectiles.
    attributes:
      damage:
        description: Hull or integrity points removed per hit.
        range: Amount
        required: true
      fire_rate:
        description: Shots per second.
        range: Amount
        required: true
        unit:
          ucum_code: /s
      projectile_speed:
        description: Speed of a fired projectile.
        range: Speed
        required: true
      max_range:
        description: Distance after which a projectile dissipates.
        range: Distance
        required: true

  ShipClass:
    in_subset: [content]
    is_a: NamedThing
    description: A hull design that pilot and raider ships are built from.
    attributes:
      max_hull:
        description: Hull points of an undamaged ship.
        range: Amount
        required: true
      max_speed:
        description: Top linear speed.
        range: Speed
        required: true
      acceleration:
        description: Linear acceleration under full thrust.
        range: Amount
        required: true
        unit:
          ucum_code: m/s2
      turn_rate:
        description: Maximum angular speed.
        range: Amount
        required: true
        unit:
          ucum_code: rad/s
      fuel_capacity:
        description: Maximum fuel the tank holds. Zero for ships that never jump.
        range: Amount
        required: true
      scoop_radius:
        description: >-
          Distance within which the fuel scoop takes in a fuel pod. Zero for
          ships without a scoop.
        range: Distance
        required: true
      tractor_range:
        description: Distance within which the ship pulls fuel pods toward itself.
        range: Distance
        required: true
      tractor_speed:
        description: Speed at which a pulled fuel pod moves toward the ship.
        range: Speed
        required: true
      weapons:
        description: Weapons mounted on every ship of this class.
        range: WeaponType
        multivalued: true
        inlined: false

  RaiderType:
    in_subset: [content]
    is_a: NamedThing
    description: >-
      A raider archetype: which hull it flies, when it engages, how close it
      fights, and what it leaves when destroyed.
    slots:
      - ship_class
      - fuel_yield
    attributes:
      detection_range:
        description: Distance within which the raider notices and chases a pilot ship.
        range: Distance
        required: true
      keep_distance:
        description: Distance from its target at which the raider stops closing in.
        range: Distance
        required: true

  AsteroidType:
    in_subset: [content]
    is_a: NamedThing
    description: >-
      A kind of asteroid. Shooting it until its integrity reaches zero breaks
      it and leaves a fuel pod.
    slots:
      - radius
      - fuel_yield
    slot_usage:
      radius:
        description: Collision radius of the asteroid.
    attributes:
      max_integrity:
        description: Damage needed to break the asteroid.
        range: Amount
        required: true

  Galaxy:
    in_subset: [content]
    tree_root: true
    is_a: NamedThing
    description: >-
      Star systems connected by jump routes, and the kinds of ships, weapons,
      raiders and asteroids found among them.
    attributes:
      weapon_types:
        description: Weapons that ship classes mount.
        range: WeaponType
        multivalued: true
        inlined_as_list: true
      ship_classes:
        description: Hull designs that pilot and raider ships are built from.
        range: ShipClass
        multivalued: true
        inlined_as_list: true
      raider_types:
        description: Raider archetypes that roam the star systems.
        range: RaiderType
        multivalued: true
        inlined_as_list: true
      asteroid_types:
        description: Asteroid kinds found in the star systems.
        range: AsteroidType
        multivalued: true
        inlined_as_list: true
      star_systems:
        description: Every star system of the galaxy.
        range: StarSystem
        multivalued: true
        required: true
        inlined_as_list: true

  StarSystem:
    in_subset: [content]
    is_a: NamedThing
    description: >-
      The space around one star. A pilot ship can jump to any system in
      jump_targets once it carries at least jump_fuel_cost fuel.
    attributes:
      star_class:
        description: Spectral class of the star, driving its look.
        range: SpectralClass
        required: true
      bounds_radius:
        description: Radius of the navigable sphere centred on the star.
        range: Distance
        required: true
      jump_fuel_cost:
        description: Fuel consumed by a jump out of this system.
        range: Amount
        required: true
      jump_targets:
        description: Systems reachable by a single jump from this one.
        range: StarSystem
        multivalued: true
        inlined: false
      asteroid_fields:
        description: Asteroid fields of this system.
        range: AsteroidField
        multivalued: true
        inlined_as_list: true
      raider_packs:
        description: Raider packs of this system.
        range: RaiderPack
        multivalued: true
        inlined_as_list: true

  Region:
    in_subset: [content]
    abstract: true
    description: A sphere inside a star system that holds a number of bodies.
    slots:
      - radius
    slot_usage:
      radius:
        description: Radius of the region.
    attributes:
      center:
        description: Centre of the region, relative to the star.
        range: Vector3D
        required: true
        inlined: true
      count:
        description: Number of bodies the region holds.
        range: integer
        required: true
        minimum_value: 1

  AsteroidField:
    in_subset: [content]
    is_a: Region
    description: A region filled with asteroids of one type.
    slots:
      - asteroid_type

  RaiderPack:
    in_subset: [content]
    is_a: Region
    description: A region that raiders of one type hold.
    slots:
      - raider_type

  # ------------------------------------------------------------ state

  GalaxyState:
    in_subset: [state]
    description: >-
      What is where in a galaxy at one moment: its pilots, their ships, and
      the state of the star systems visited so far.
    slots:
      - id
    attributes:
      galaxy:
        description: The galaxy this is the state of.
        range: Galaxy
        required: true
        inlined: false
      pilots:
        description: Everyone who flies a ship in the galaxy.
        range: Pilot
        multivalued: true
        required: true
        inlined_as_list: true
      pilot_ships:
        description: The ship of each pilot.
        range: PilotShip
        multivalued: true
        inlined_as_list: true
      system_states:
        description: >-
          State of the systems visited so far. A system without state has not
          been visited yet.
        range: StarSystemState
        multivalued: true
        inlined_as_list: true

  Pilot:
    in_subset: [state]
    is_a: NamedThing
    description: A person who flies a ship. Other pilots know them by name.

  StarSystemState:
    in_subset: [state]
    description: >-
      The state of one star system: what remains of its asteroids and
      raiders, and the fuel pods floating there.
    attributes:
      star_system:
        description: The star system this state belongs to.
        range: StarSystem
        required: true
        inlined: false
      asteroids:
        description: Asteroids not broken yet.
        range: Asteroid
        multivalued: true
        inlined_as_list: true
      raider_ships:
        description: Raider ships not destroyed yet.
        range: RaiderShip
        multivalued: true
        inlined_as_list: true
      fuel_pods:
        description: Fuel pods not scooped up yet.
        range: FuelPod
        multivalued: true
        inlined_as_list: true

  SpaceEntity:
    in_subset: [state]
    abstract: true
    description: >-
      Anything with a physical presence in a star system.
    slots:
      - id
    attributes:
      position:
        description: Position relative to the star of the current system.
        range: Vector3D
        required: true
        inlined: true
      velocity:
        description: Linear velocity.
        range: Vector3D
        inlined: true
      orientation:
        description: Facing of the entity.
        range: Attitude
        inlined: true

  Ship:
    in_subset: [state]
    abstract: true
    is_a: SpaceEntity
    description: A flying, armed entity that can be destroyed.
    attributes:
      hull:
        description: Remaining hull points. The ship is destroyed at zero.
        range: Amount
        required: true

  PilotShip:
    in_subset: [state]
    is_a: Ship
    description: A ship flown by a pilot.
    slots:
      - ship_class
    attributes:
      pilot:
        description: The pilot flying the ship.
        range: Pilot
        required: true
        inlined: false
      current_system:
        description: The star system the ship is in.
        range: StarSystem
        required: true
        inlined: false
      fuel:
        description: Fuel in the tank, at most the ship class fuel_capacity.
        range: Amount
        required: true

  RaiderShip:
    in_subset: [state]
    is_a: Ship
    description: A hostile ship. Its hull design comes from its raider type.
    slots:
      - raider_type

  Asteroid:
    in_subset: [state]
    is_a: SpaceEntity
    description: An asteroid that breaks into a fuel pod when shot enough.
    slots:
      - asteroid_type
    attributes:
      integrity:
        description: Remaining integrity. The asteroid breaks at zero.
        range: Amount
        required: true

  FuelPod:
    in_subset: [state]
    is_a: SpaceEntity
    description: Fuel floating in space, scooped up by a pilot ship that flies into it.
    attributes:
      fuel_amount:
        description: Fuel the pod holds.
        range: Amount
        required: true

slots:
  id:
    identifier: true
    slot_uri: schema:identifier
    range: string
    description: A unique identifier.
  name:
    slot_uri: schema:name
    required: true
    description: A human-readable name.
  description:
    slot_uri: schema:description
    description: A human-readable description.
  x:
    description: X component.
    range: float
    required: true
  y:
    description: Y component.
    range: float
    required: true
  z:
    description: Z component.
    range: float
    required: true
  w:
    description: W (scalar) component.
    range: float
    required: true
  radius:
    description: Radius of a sphere.
    range: Distance
    required: true
  fuel_yield:
    description: Fuel in the pod left when this is destroyed.
    range: Amount
    required: true
  ship_class:
    description: The hull design.
    range: ShipClass
    required: true
    inlined: false
  asteroid_type:
    description: The kind of asteroid.
    range: AsteroidType
    required: true
    inlined: false
  raider_type:
    description: The raider archetype.
    range: RaiderType
    required: true
    inlined: false

enums:

  SpectralClass:
    in_subset: [content]
    description: Morgan-Keenan spectral class of a star, hottest to coolest.
    permissible_values:
      o:
        title: O
        description: Blue, above 30,000 K.
      b:
        title: B
        description: Blue-white, 10,000 to 30,000 K.
      a:
        title: A
        description: White, 7,500 to 10,000 K.
      f:
        title: F
        description: Yellow-white, 6,000 to 7,500 K.
      g:
        title: G
        description: Yellow, 5,200 to 6,000 K, like the Sun.
      k:
        title: K
        description: Orange, 3,700 to 5,200 K.
      m:
        title: M
        description: Red, below 3,700 K.
