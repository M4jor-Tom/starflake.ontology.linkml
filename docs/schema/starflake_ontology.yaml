      damage:
        name: damage
        description: Hull or integrity points removed per hit.
        range: Amount
        required: true
      fire_rate:
        name: fire_rate
        description: Shots per second.
        range: Amount
        required: true
        unit:
          ucum_code: /s
      projectile_speed:
        name: projectile_speed
        description: Speed of a fired projectile.
        range: Speed
        required: true
      max_range:
